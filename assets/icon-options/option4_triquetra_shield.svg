  <!-- Claude Petal at Bottom Left -->
  <circle cx="4.2" cy="16.5" r="1.3" fill="#D97757"/>
  <!-- Codex Terminal Chevron at Bottom Right -->
  <circle cx="19.8" cy="16.5" r="1.3" fill="#10A37F"/>
