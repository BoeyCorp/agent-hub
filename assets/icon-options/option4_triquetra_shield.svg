        d="M12 2.2 C15.5 2.2 19 6.5 17.5 12 C16.5 15.5 13 17 12 21 C11 17 7.5 15.5 6.5 12 C5 6.5 8.5 2.2 12 2.2 Z" 
        stroke="#10A37F" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Star Hub Nexus -->
  <path d="M12 8.5 C12 10.5 10.5 12 8.5 12 C10.5 12 12 13.5 12 15.5 C12 13.5 13.5 12 15.5 12 C13.5 12 12 10.5 12 8.5 Z" fill="#ffffff"/>

  <!-- Apex Detail Accents -->
