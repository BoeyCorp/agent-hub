  <path d="M12 2.2 C15.5 2.2 19 6.5 17.5 12 C16.5 15.5 13 17 12 21 C11 17 7.5 15.5 6.5 12 C5 6.5 8.5 2.2 12 2.2 Z" 
        stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <!-- Bottom-Left Arc (Claude Blade) -->
